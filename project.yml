name: Taskomatic
configs:
  Debug: debug
  Release: release
  Local: debug
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  knownRegions: [en, fr, Base]
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: JHN7TLUQWR
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  TaskomaticCore:
    path: .
targets:
  Taskomatic:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TaskomaticCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pierreteodoresco.taskomatic
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Taskomatic.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Taskomatic
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: Config/Local.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) DEBUG LOCAL_ONLY'
  TaskomaticTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TaskomaticTests]
    dependencies:
      - target: Taskomatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pierreteodoresco.taskomatic.tests
        GENERATE_INFOPLIST_FILE: YES
  TaskomaticUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TaskomaticUITests]
    dependencies:
      - target: Taskomatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pierreteodoresco.taskomatic.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Taskomatic:
    build:
      targets:
        Taskomatic: all
        TaskomaticTests: [test]
        TaskomaticUITests: [test]
    test:
      targets: [TaskomaticTests, TaskomaticUITests]
  TaskomaticLocal:
    build:
      targets:
        Taskomatic: all
    run:
      config: Local
    archive:
      config: Local
